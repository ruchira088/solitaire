<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b6138" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Solitaire</title>
    <meta
      name="description"
      content="Klondike Solitaire in the browser. Crisp SVG cards, a new daily deal every day, and shareable deal codes so you can send someone the exact game you played."
    />
    <!-- Link previews. A deal is shared by copying the URL, so a pasted link that
         unfurls into nothing costs the game its whole distribution path. These are
         deliberately static: og:url and canonical point at the bare site even for a
         "?deal=" link, since every deal is the same page and the preview would be the
         same picture. /og.png is 1200x630 (the 1.91:1 that scrapers show uncropped)
         and is regenerated by `npm run screenshots` along with the README shots, so it
         can't drift from what the game actually looks like. -->
    <link rel="canonical" href="https://solitaire.ruchij.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Solitaire" />
    <meta property="og:title" content="Solitaire — Klondike in the browser" />
    <meta
      property="og:description"
      content="Klondike Solitaire in the browser. Crisp SVG cards, a new daily deal every day, and shareable deal codes so you can send someone the exact game you played."
    />
    <meta property="og:url" content="https://solitaire.ruchij.com/" />
    <meta property="og:image" content="https://solitaire.ruchij.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A game of Klondike Solitaire in progress, cards fanned across a dark green felt table."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <button id="btn-chrome" class="btn icon-btn chrome-toggle" type="button" aria-expanded="true" title="Hide the toolbar (T)" aria-label="Hide the toolbar">☰</button>
        <div class="brand">
          <span class="pip red">&#9829;</span><span class="pip">&#9824;</span>
          <h1>Solitaire</h1>
        </div>
        <div class="controls">
          <button id="btn-new" class="btn" title="Start a new game"><span class="ico" aria-hidden="true">🃏</span>New Game</button>
          <button id="btn-restart" class="btn" title="Replay this same deal from the start"><span class="ico" aria-hidden="true">🔄</span>Restart</button>
          <button id="btn-undo" class="btn" title="Undo last move (Ctrl+Z)"><span class="ico" aria-hidden="true">↺</span>Undo</button>
          <button id="btn-redo" class="btn" title="Redo (Ctrl+Shift+Z)"><span class="ico" aria-hidden="true">↻</span>Redo</button>
          <div class="seg" id="draw-toggle" title="Cards drawn from the stock">
            <button class="seg-btn is-active" data-draw="1">Draw 1</button>
            <button class="seg-btn" data-draw="3">Draw 3</button>
          </div>
          <button id="btn-easy" class="btn" title="Easy mode: empty columns accept any card" aria-pressed="false"><span class="ico" aria-hidden="true">👶</span>Easy</button>
          <button id="btn-add-stack" class="btn" title="Add a temporary ✦ stack (−50 points, max 3; it disappears when emptied)">+ Stack</button>
          <button id="btn-hand" class="btn icon-btn" type="button" title="Move the stock and foundations to the other side" aria-label="Switch the rail to the other side">🤚</button>
          <button id="btn-winnable" class="btn icon-btn" type="button" title="Deal a game that can be won (W)" aria-label="Deal a game that can be won">🎲</button>
          <button id="btn-hint" class="btn icon-btn" type="button" title="Show a move from a winning line (H)" aria-label="Show a move from a winning line">💡</button>
          <button id="btn-analyse" class="btn icon-btn" type="button" title="Can this deal still be won?" aria-label="Can this deal still be won?">🔍</button>
          <button id="btn-daily" class="btn icon-btn" type="button" title="Play today's deal" aria-label="Play today's deal">📅</button>
          <button id="btn-stats" class="btn icon-btn" type="button" title="Statistics" aria-label="Statistics">📊</button>
          <button id="btn-sound" class="btn icon-btn" title="Mute sound effects" aria-label="Toggle sound">🔊</button>
          <button id="btn-theme" class="btn icon-btn" title="Toggle light / dark theme" aria-label="Toggle theme">🌙</button>
        </div>
        <div class="stats">
          <div class="stat"><span class="label">Time</span><span id="stat-time" class="value">0:00</span></div>
          <div class="stat"><span class="label">Moves</span><span id="stat-moves" class="value">0</span></div>
          <div class="stat"><span class="label">Score</span><span id="stat-score" class="value">0</span></div>
        </div>
      </header>
      <!-- role="application" so a screen reader hands the arrow keys to the game
           rather than eating them for browse mode; the live region below is what
           speaks the board, since a canvas has nothing to read. -->
      <canvas
        id="board"
        tabindex="0"
        role="application"
        aria-label="Solitaire board. Arrow keys move between piles, Shift with up or down takes more or fewer cards, Space picks up and drops, F sends a card to its foundation, keys 1 to 7 jump to a column."
        aria-describedby="a11y-status"
      ></canvas>
      <div id="a11y-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
      <!-- Transient messages over the board. Announced through the live region too,
           so the answer reaches both audiences. -->
      <div id="toast" hidden></div>
      <!-- Sits over the board while the cards cascade. No backdrop, and the wrapper
           passes pointer events through, so the celebration keeps running and the
           toolbar stays usable behind it. -->
      <div id="win-overlay" hidden>
        <div id="win-panel" role="dialog" aria-labelledby="win-title">
          <h2 id="win-title">You Win! 🎉</h2>
          <p id="win-score">Score 0</p>
          <p id="win-daily" hidden></p>
          <div class="dialog-actions">
            <button id="win-new" class="btn" type="button"><span class="ico" aria-hidden="true">🃏</span>New Game</button>
            <button id="win-restart" class="btn" type="button" title="Replay this same deal from the start"><span class="ico" aria-hidden="true">🔄</span>Restart</button>
            <button id="win-share" class="btn" type="button" title="Copy your result and a link to this deal"><span class="ico" aria-hidden="true">🔗</span><span id="win-share-label">Share</span></button>
          </div>
        </div>
      </div>
    </div>
    <div id="stats-overlay" hidden>
      <div id="stats-panel" role="dialog" aria-modal="true" aria-labelledby="stats-title">
        <h2 id="stats-title">Statistics</h2>
        <dl id="stats-list"></dl>
        <div class="dialog-actions">
          <button id="stats-reset" class="btn" type="button"><span class="ico" aria-hidden="true">🧹</span><span id="stats-reset-label">Reset stats</span></button>
          <button id="stats-close" class="btn" type="button">Close</button>
        </div>
      </div>
    </div>
    <div id="start-overlay">
      <!-- Where a shared win lands. A `?win=` the parser accepts fills this in with the
           sender's result and the board it was scored on, and the start button below
           turns into "Can you beat …?" — the link is an invitation to play that deal,
           so the score to beat has to be on screen before the cards are. Hidden on an
           ordinary boot. -->
      <div id="challenge" hidden>
        <p class="challenge-kicker">You've been challenged</p>
        <div class="challenge-stats">
          <div class="stat"><span class="label">Score</span><span id="challenge-score" class="value">0</span></div>
          <div class="stat"><span class="label">Time</span><span id="challenge-time" class="value">0:00</span></div>
          <div class="stat"><span class="label">Moves</span><span id="challenge-moves" class="value">0</span></div>
        </div>
        <p id="challenge-deal" class="challenge-deal"></p>
      </div>
      <button id="start-btn" type="button">
        <span class="start-pips"><span class="pip red">&#9829;</span><span class="pip">&#9824;</span></span>
        <span class="start-title">Click to play</span>
        <span class="start-tip"><strong>Easy mode</strong> lets any card sit on an empty column — not just Kings. Stuck? <strong>+ Stack</strong> adds a temporary ✦ pile to park a run on (−50 points, up to 3); a stack vanishes once you empty it.</span>
      </button>
      <button id="start-new" class="start-alt" type="button" hidden>Start a new game instead</button>
      <button id="start-mute" class="btn icon-btn" type="button" title="Mute sound effects" aria-label="Toggle sound">🔊</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
