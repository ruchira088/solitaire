---
- hosts: localhost
  connection: local

  tasks:
    - name: Gather git information
      import_tasks: tasks/git-info.yml

    - name: Install dependencies
      import_tasks: tasks/install-dependencies.yml

    - name: Build production bundle
      block:
        # CI hands over the dist/ that passed the smoke test, so what ships is what
        # was tested rather than a second build of the same commit. It signals that
        # with PREBUILT_BUNDLE rather than by the directory merely existing: a local
        # run must keep building from scratch, since silently zipping a stale dist/
        # left lying around is the one outcome worse than a slow upload.
        - name: Verify the handed-over bundle arrived
          when: lookup('env', 'PREBUILT_BUNDLE') | lower == 'true'
          block:
            - stat:
                path: ../dist/index.html
              register: prebuilt_index

            - assert:
                that: prebuilt_index.stat.exists
                fail_msg: PREBUILT_BUNDLE is set, but ../dist/index.html is missing

        - name: Build the production bundle
          when: lookup('env', 'PREBUILT_BUNDLE') | lower != 'true'
          block:
            - name: Remove existing production bundle
              file:
                path: ../dist
                state: absent

            - name: Build production bundle
              shell: |
                cd ../ && npm ci && npm run build

        - name: Ensure bundle output directory exists
          file:
            path: ../build
            state: directory

        - name: Zip production bundle
          archive:
            path: ../dist/*
            dest: ../build/client.zip
            format: zip

    - name: Upload to S3
      block:
        - name: Create S3 bucket
          amazon.aws.s3_bucket:
            name: solitaire-bundles.ruchij.com
            state: present

        - name: Upload production bundle to S3
          amazon.aws.s3_object:
            bucket: solitaire-bundles.ruchij.com
            object: "{{ git_branch }}/{{ git_commit }}/client.zip"
            src: ../build/client.zip
            mode: put
